[package]
name = "foomodern"
version = "0.2.0"
description = "A fast, modern music player"
authors = ["r0madeus"]
license = ""
repository = "https://github.com/r0madeus/foomodern"
edition = "2024"
rust-version = "1.90"

[lib]
name = "foomodern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# Versions are pinned on purpose (see AGENTS.md). Check docs.rs for the
# pinned version before writing code against these crates.
[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "=2.10.2"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
log = "=0.4.35"
thiserror = "=2.0.21"
libmpv2 = "=7.0.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
lofty = "=0.25.5"
walkdir = "=2.5.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "query"] }
souvlaki = "=0.9.3"
tokio = { version = "=1.54.1", features = ["rt"] }

[dev-dependencies]
hound = "=3.5.1"
tempfile = "=3.27.0"

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; empty uses v<version> from tauri.conf.json)'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows Release (test + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch LGPL libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Sync version from release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG.Trim()
          } else {
            ''
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { return }
          $ver = $tag -replace '^v', ''
          if ($ver -match '^\d+\.\d+$') { $ver = "$ver.0" }
          if ($ver -notmatch '^\d+\.\d+\.\d+') { return }

          $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw
          $conf = [regex]::Replace($conf, '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`"", 1)
          Set-Content -Path 'src-tauri/tauri.conf.json' -Value $conf -NoNewline -Encoding utf8NoBOM

          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', "version = `"$ver`"", 1)
          Set-Content -Path 'src-tauri/Cargo.toml' -Value $cargo -NoNewline -Encoding utf8NoBOM

          $pkg = Get-Content 'package.json' -Raw
          $pkg = [regex]::Replace($pkg, '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`"", 1)
          Set-Content -Path 'package.json' -Value $pkg -NoNewline -Encoding utf8NoBOM

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG.Trim()
          } else {
            $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            "v$($conf.version)"
          }

          $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe'
          if (-not $installers) {
            throw 'No NSIS .exe installer found in src-tauri/target/release/bundle/nsis'
          }

          $staging = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $assets = @()
          $hashes = @()
          foreach ($file in $installers) {
            $dest = Join-Path $staging $file.Name
            Copy-Item -Path $file.FullName -Destination $dest -Force
            $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $($file.Name)"
            $assets += $dest
          }

          $checksumFile = Join-Path $staging 'SHA256SUMS.txt'
          Set-Content -Path $checksumFile -Value ($hashes -join "`n") -Encoding utf8
          $assets += $checksumFile

          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($exists) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $isPrerelease = ($env:INPUT_PRERELEASE -eq 'true') -or ($tag -match '-')
            $releaseArgs = @('release', 'create', $tag) + $assets + @(
              '--title', "FooModern $tag",
              '--target', $env:GITHUB_SHA,
              '--generate-notes'
            )
            if ($isPrerelease) {
              $releaseArgs += '--prerelease'
            }
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Runs after the Windows job, which creates the GitHub release.
  android-release:
    name: Android Release (APK)
    needs: windows-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The runner image ships the Android SDK and NDK.
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Resolve release tag and sync version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          ver="${tag#v}"
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+$ ]]; then ver="$ver.0"; fi
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # versionName / versionCode of the APK come from this version.
            VER="$ver" node -e '
              const fs = require("fs")
              const p = "src-tauri/tauri.conf.json"
              const conf = JSON.parse(fs.readFileSync(p, "utf8"))
              conf.version = process.env.VER
              fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n")
            '
          fi

      - name: Generate Android project
        run: npm run tauri -- android init --ci

      # With the signing secrets set, a release APK is built and signed with
      # the same key every time, so new versions install over old ones.
      # Without them a debug APK is published instead: its key changes on
      # every run, so it has to be uninstalled before the next install.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "APK_KIND=release" >> "$GITHUB_ENV"
            npm run tauri -- android build --apk --target aarch64 --ci
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; publishing a debug APK (cannot be updated in place)."
            echo "APK_KIND=debug" >> "$GITHUB_ENV"
            npm run tauri -- android build --apk --target aarch64 --debug --ci
          fi

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out_dir="src-tauri/gen/android/app/build/outputs/apk"
          staging="$RUNNER_TEMP/android-assets"
          mkdir -p "$staging"
          name="FooModern-${RELEASE_TAG}-android-arm64"
          if [ "$APK_KIND" = "release" ]; then
            unsigned="$(find "$out_dir" -name '*release*.apk' | head -n 1)"
            [ -n "$unsigned" ] || { echo "No release APK found in $out_dir"; exit 1; }
            tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            ks="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
            "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign \
              --ks "$ks" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$staging/$name.apk" \
              "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify "$staging/$name.apk"
            rm -f "$ks"
          else
            debug="$(find "$out_dir" -name '*debug*.apk' | head -n 1)"
            [ -n "$debug" ] || { echo "No debug APK found in $out_dir"; exit 1; }
            cp "$debug" "$staging/$name-debug.apk"
          fi
          (cd "$staging" && sha256sum *.apk > SHA256SUMS-android.txt)
          echo "ANDROID_ASSETS=$staging" >> "$GITHUB_ENV"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$ANDROID_ASSETS"/* --clobber
